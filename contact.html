<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple place for coffee lovers">
  <title>Contact | Brew &amp; So</title>
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="brand">Brew &amp; So</a>
    <nav>
      <ul class="menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="page-title">
      <p>GET IN TOUCH</p>
      <h1>Contact</h1>
    </section>

    <section class="contact-grid">
      <!-- the form only looks like a form for now, it doesn't send anything yet -->
      <form class="contact-form">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="How can we help?"></textarea>
        <button type="submit" class="btn">Send Message</button>
      </form>
      <div class="contact-info">
        <h2>Contact Info</h2>
        <p>hello@brewandco.com</p>
        <p>+966</p>
      </div>
    </section>

  </main>
  <footer class="site-footer">
    <div class="footer-grid">
      <div>
        <h3>Brew &amp; So</h3>
        <p>A simple place for coffee lovers</p>
      </div>

      <div>
        <h4>Hours</h4>
        <p>Daily 7:00 AM - 12:00 AM</p>
      </div>
      <div>
        <h4>Follow</h4>
        <p><a href="#">Instagram</a></p>
        <p><a href="#">X</a></p>
      </div>
    </div>
  </footer>
</body>
</html>
